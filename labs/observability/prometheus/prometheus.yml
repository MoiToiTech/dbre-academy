global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  # The course's rules, then your own: module 8 asks you to write alert rules
  # into rules.d/. A glob that matches no file is not an error.
  - /etc/prometheus/dbre/alerts.yml
  - /etc/prometheus/dbre/rules.d/*.yml

scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ["exporter-primary:9104"]
        labels: { instance: primary, role: primary }
      - targets: ["exporter-replica:9104"]
        labels: { instance: replica, role: replica }
