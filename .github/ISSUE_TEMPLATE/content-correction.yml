name: Content correction
description: A technical claim is wrong, outdated or misleading
labels: [content]
body:
  - type: input
    id: where
    attributes:
      label: File and section
    validations: { required: true }
  - type: textarea
    id: claim
    attributes:
      label: What the course says, and what is correct
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Source (documentation link)
