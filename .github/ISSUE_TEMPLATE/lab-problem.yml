name: Lab problem
description: A command, scenario or check does not behave as the lesson says
labels: [lab]
body:
  - type: input
    id: where
    attributes:
      label: Module and step
      placeholder: "04-explain-indexing, exercise step 3"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of ./lab doctor and ./lab status
      render: text
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: OS, CPU architecture, Docker product and version
      placeholder: "macOS 15, arm64, OrbStack 1.x"
