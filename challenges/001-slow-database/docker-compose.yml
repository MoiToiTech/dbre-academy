# MoiToi Engineering Challenge #001 — "The database is slow. Nobody changed anything."
# Start it with ./challenge start (or make start), not with docker compose directly:
# the start script loads the data and replays the night before the incident.
name: ${CH001_PROJECT:-ch001}

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: challenge   # local lab only; bound to 127.0.0.1
    command: ["--defaults-extra-file=/etc/mysql/challenge.cnf"]
    volumes:
      - ./mysql/challenge.cnf:/etc/mysql/challenge.cnf:ro
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${CH001_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "-uroot", "-pchallenge", "-h127.0.0.1", "ping", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 90
    mem_limit: 1g

  # The order service: one producer and two outbox workers.
  app:
    image: mysql:8.4.11
    entrypoint: ["bash", "/app/run.sh"]
    volumes:
      - ./app:/app:ro
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped

  # Last night's export job for the analytics team.
  nightly-export:
    image: mysql:8.4.11
    entrypoint: ["bash", "/app/nightly-export.sh"]
    volumes:
      - ./app:/app:ro
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m
    restart: "no"

volumes:
  db-data:
